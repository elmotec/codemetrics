# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: Python application

on: [pull_request]

jobs:
  windows-latest-python:
    name: Windows / latest stable Python
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7
    - name: Set up latest stable Python
      uses: actions/setup-python@v7
      with:
        python-version: 3.x
        check-latest: true
        allow-prereleases: false
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
    - name: Show Python version
      run: python --version
    - name: Install dependencies
      run: uv sync --locked --no-dev
    - name: Test with unittest
      run: uv run --locked --no-dev python -m unittest discover -s tests -t . -v

  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{matrix.python-version}}
      uses: actions/setup-python@v7
      with:
        python-version: ${{matrix.python-version}}
    - name: Set up uv
      uses: astral-sh/setup-uv@v10.3.3
    - name: Install dependencies
      run: uv sync --locked
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run --locked flake8 codemetrics tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run --locked flake8 codemetrics tests --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      run: |
        uv run --locked pytest
