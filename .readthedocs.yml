version: 2

build:
  os: ubuntu-lts-latest
  tools:
    python: '3.13'
  jobs:
    create_environment:
    - curl -LsSf https://astral.sh/uv/install.sh | sh
    - $HOME/.local/bin/uv venv "$READTHEDOCS_VIRTUALENV_PATH" --python 3.13
    install:
    - UV_PROJECT_ENVIRONMENT="$READTHEDOCS_VIRTUALENV_PATH" $HOME/.local/bin/uv sync --locked --no-dev --group docs

sphinx:
  configuration: docs/conf.py
