[build-system]
requires = [
    "setuptools>=40.9.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "codemetrics"
version = "2.0.0"
description = "SCM mining utility classes"
readme = "README.rst"
license = "MIT"
keywords = ["code", "metrics", "mining", "scm", "subversion", "svn", "Adam Tornhill", "utilities"]
authors = [
    {name = "elmotec", email = "elmotec@gmx.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Natural Language :: English",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development",
    "Topic :: Utilities",
    "Topic :: Software Development :: Version Control",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
]
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "click",
    "pandas",
    "tqdm",
    "python-dateutil",
    "scikit-learn",
    "lizard",
    "mypy-extensions",
]

[project.urls]
Homepage = "http://github.com/elmotec/codemetrics"

[project.scripts]
cm_func_stats = "codemetrics.cmdline:cm_func_stats"

[dependency-groups]
dev = [
    "black[d]",
    "commitizen",
    "coverage",
    "flake8",
    "pre-commit",
    "watchdog",
    "pytest",
]
notebooks = [
    "altair",
    "ipywidgets",
    "jupyterlab",
    "matplotlib",
]
docs = [
    "Sphinx",
    "sphinx-autodoc-typehints",
    "sphinx_rtd_theme",
]

[tool.uv]
exclude-newer = "7 days"

[tool.setuptools]
packages = ["codemetrics"]
include-package-data = true

[tool.commitizen]
name = "cz_conventional_commits"
version = "2.0.0"
tag_format = "v$version"
version_files = [
    "pyproject.toml:version",
    "codemetrics/__init__.py:__version__",
]
